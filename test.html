<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>차량 데이터 테스트</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      padding: 50px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .car-card {
      width: 500px;
      margin: 0 auto;
      padding: 30px;
      background: #fff;
      border-radius: 12px;
    }

    .car-card img {
      width: 100%;
      height: 250px;
      object-fit: contain;
      background: #eee;
    }

    .car-card h2 {
      margin: 20px 0;
      font-size: 22px;
    }

    .car-card p {
      margin-bottom: 10px;
      line-height: 1.6;
    }

    .car-card ul {
      margin: 10px 0 20px 20px;
    }

    .car-card li {
      margin-bottom: 5px;
    }
  </style>
</head>

<body>

  <div id="carList"></div>

  <script>
    const carList = document.querySelector('#carList');

    fetch('../../assets/data/cars-100.json')
      .then(response => response.json())
      .then(cars => {

        // 1번 차량만 가져오기
        const car = cars[0];

        carList.innerHTML = `
          <div class="car-card">

            <img src="${car.thumbnail}" alt="${car.model}">

            <h2>${car.modelName}</h2>

            <p>id : ${car.id}</p>
            <p>카테고리 : ${car.category}</p>
            <p>국산 / 수입 : ${car.origin}</p>
            <p>브랜드 : ${car.brand}</p>
            <p>모델 : ${car.model}</p>
            <p>차종 : ${car.bodyType}</p>
            <p>연료 : ${car.fuel}</p>
            <p>등록일 : ${car.regDate}</p>
            <p>연식 : ${car.modelYear}</p>
            <p>주행거리 : ${car.mileage.toLocaleString()}km</p>
            <p>가격 : ${car.price.toLocaleString()}만원</p>
            <p>월 납입금 : ${car.monthlyPayment.toLocaleString()}원</p>

            <h3>태그</h3>
            <ul>
              ${car.tags.map(tag => `<li>${tag}</li>`).join('')}
            </ul>

            <h3>옵션</h3>
            <ul>
              ${car.options.map(option => `<li>${option}</li>`).join('')}
            </ul>

          </div>
        `;

      })
      .catch(error => {
        console.log('에러:', error);
      });
  </script>

</body>

</html>
